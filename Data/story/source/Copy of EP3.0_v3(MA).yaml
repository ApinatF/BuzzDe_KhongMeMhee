- background: bg_living_room_yamada
- music: bgm_Cozy
- msg: >-
    เวลาผ่านไป Akari และ Minato ตั้งใจอย่างหนักในมหาลัยและกำลังจะเข้าสู่ปลาย
    เทอม ที่ 1 ในที่สุด
  character: narrator
- character: akari
  position: center
  act: idle
- msg: พี่จ๋า  หนูกลับมาแล้ว~ พี่ทำอะไรอยู่หรือ
  character: akari
- character: minato
  position: left
  act: idle
- msg: 'อ่อนั่งอยู่… ก็นั่งเล่นเกมปกติผ่อนคล้ายๆ ไม่รู้จะทำอะไรดีนะ '
  character: minato
- msg: 'แหม่พี่อย่าเล่นแต่เกมสิหาอะไรทำอย่างอ่านบ้างไม่ดีกว่าหรอ '
  character: akari
- msg: จะให้พี่อ่านอะไรละไลท์โนเวล กับ มังงะก็อ่านหมดทุกเล่มแล้วด้วย
  character: minato
- msg: ให้ตายสิพี่นี้ละก็…
  character: akari
- msg: 'อะจริงด้วยพี่หนูมีเรื่องอยากให้ช่วยหน่อย '
  character: akari
- msg: 'มีอะไรงั้นหรอ '
  character: minato
- msg: >-
    อืมม  ช่วงนี้หนูกำลังหามังงะเรื่องใหม่อยู่ พี่จ๋า ช่วยแนะนำมังงะให้หน่อยสิ
    เรื่องไหนหน้าอ่านบ้าง
  character: akari
- msg: อยากให้พี่แนะนำงั้นหรอ
  character: minato
- msg: ใช่ค่ะแนะนำให้หนูหน่อยน่าาา~
  character: akari
- msg: งั้นพี่ขอขึ้นไปหยิบมังงะที่พี่คิดว่าเหมาะมาให้ก่อนนะ
  character: minato
- msg: ได้ค่ะหนูรอได้
  character: akari
- msg: รอพี่แปบนะ * ขึ้นห้องไปหยิบมังงะ *
  character: minato
- msg: ระหว่างนี้ทำไรดีนะ *นั่งลงโซฟา*
  character: akari
- msg: '*เปิดโทรศัพท์ขึ้นมา* มีร้านของหวานอะไรน่าสนใจบ้างไหมน่าา~'
  character: akari
- msg: เวลาผ่านไปไม่นาน
  character: narrator
- msg: Akari พี่เอามังงะที่คิดว่าเหมาะกับน้องมาให้เลือกละนะ–
  character: minato
- msg: อู้ววว! ร้านนี้ต้องไปกินให้ได้เลยต้องให้พี่พาไปซะแล้ว~
  character: akari
- msg: Akari!!
  character: minato
- msg: อะ..เอ๋…พี่เองหรอ
  character: akari
- msg: พี่เอาหนังสือมาให้ละนะลองดูว่ามีเรื่องไหนน่าสนใจบ้างไหม
  character: minato
- msg: '*วางหนังสือ 3 เล่มบนโต๊ะ* (เสียงฟึบ)'
  character: minato
- goto:
    - Copy of EP3.0_v3(MA)_lb_0 if var_minato >= 8
    - Copy of EP3.0_v3(MA)_lb_4
- msg: เอาเรื่องนี้แล้วกัน
  character: minato
  label: Copy of EP3.0_v3(MA)_lb_0
- choice:
    - msg: .
      msg_override: เกิดชาตินี้จะทำอะไรดีในเมื่อเกิดชาติที่แล้วไม่ได้ทำ
    - msg: ..
      msg_override: สาวเเกลกับนายคอสเพลย์
      goto: Copy of EP3.0_v3(MA)_lb_1
    - msg: ...
      msg_override: ต้องหาโรตีอินเดียสูตรต้นตำหรับชายเเทร้สูตรดั้งเขย่าไข่
      goto: Copy of EP3.0_v3(MA)_lb_2
  character: me
  state: Copy of EP3.0_v3(MA)_st_0
- msg: เกิดชาตินี้จะทำอะไรดีในเมื่อเกิดชาติที่แล้วไม่ได้ทำ
  character: minato
- msg: >-
    เรื่องนี้ถ้าหนูจำไม่ผิด ตัวเอกหลังมาเกิดใหม่ก็เหมือนจะเล่น
    แม่เลยนิเห็นทำหน้ายิ้มน่ากลัวๆ ด้วยๆ 
  character: akari
- msg: 'แปลกดีไหมละ '
  character: minato
- msg: แต่เดี๋ยวก่อน…ทำไมแนะนำเล่นนี้ให้หนูละคะ!!... แล้วพี่อ่านเรื่องนี้จริงๆหรอ!!
  character: akari
- msg: ฮ่าาๆๆ..นิดๆหน่อยเองหน่าา แต่เนื้อหาจริงดีมากเลยนะถ้าตัดเรื่องแย่ๆออกไปนะ
  character: minato
- goto: Copy of EP3.0_v3(MA)_lb_3
- msg: สาวเเกลกับนายคอสเพลย์
  character: minato
  label: Copy of EP3.0_v3(MA)_lb_1
- msg: ถ้าจำไม่ผิดหนูจำได้ว่าเรื่องผู้ชายเรื่องนี้เเม่งหน้าหล่อมาก
  character: akari
- msg: นี้ก็เป็นเรื่องที่พี่ชอบอ่านตอนว่างๆเหมื่อนกันนะมันฮีลใจดี
  character: minato
- msg: ไม่คิดเลยนะว่าพี่ก็อยากมีโมเม้นฮีลใจกับเขาด้วย
  character: akari
- msg: 'เงียบหน่าาาา '
  character: minato
- goto: Copy of EP3.0_v3(MA)_lb_3
- msg: ต้องหาโรตีอินเดียสูตรต้นตำหรับชายเเทร้สูตรดั้งเขย่าไข่
  character: minato
  label: Copy of EP3.0_v3(MA)_lb_2
- msg: พี่ค่ะ เรื่องนี้มันแปลกๆ นะ มันมีคนแต่งเรื่องนี้อยู่บนโลกด้วยหรอ
  character: akari
- msg: เออ…สงสัยพี่หยิบผิดเรื่องมา…..
  character: minato
- msg: หนูว่า..ลืมมันไปเถอะค่ะ…
  character: akari
- msg: 'อืม.. '
  character: minato
- goto: Copy of EP3.0_v3(MA)_lb_7
