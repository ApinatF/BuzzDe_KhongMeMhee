  character: narrator
  label: Copy of EP3.0_v3(MA)_lb_7
- msg: >-
    พี่ ว่ามันก็สนุกดีนะพี่คิดว่า มังงะสมัยนี้ผู้สร้างมีไอเดีย และ
    จิตรนาการล้ำเลิศดีนะ
  character: minato
- msg: ถึงแม้บางอันจะแปลกๆก็เถอะ
  character: minato
- msg: อืมม น้องว่าก็อย่างนั้นน้าาาา~~ * พูดด้วยน้ำเสียงฉอเลาะ *
  character: akari
- msg: >-
    จริงๆแล้วพี่อีกเล่มอันนี้ของดีเลย Akari
    ลองเอาเรื่องนี้ไปอ่านดูพี่ว่าเหมาะกับน้องดี 
  character: minato
- msg: ไหนๆๆ หนูอยากเห็นๆ
  character: akari
- msg: นี้เลยเล่มนี้เกี่ยวกับอาหารเกือบทุกอย่างเลยนะ
  character: minato
- sound: sv_Ding
- msg: อาหารหรออ!! *ตาประกาย*
  character: akari
- msg: ไหนๆ! *ฉกหนังสือทันที*
  character: akari
- msg: ดะ..เดี๋ยวสิ
  character: minato
- msg: ว้าววว~ ในเรื่องมีแต่เมนูแปลกที่หน้ากินทั้งนั้นเลย~
  character: akari
- msg: 'อะ..แฮ่ม.. '
  character: minato
- msg: งะ…ขอโทษค่ะเผลอตัวไปหน่อย ขอบคุณสำหรับมังงะค่ะ
  character: akari
- msg: พออ่านแล้วคิดว่าไงบ้างอะ
  character: minato
- msg: >-
    ก็ดีสุดๆไปเลยค่ะ…. พี่แนะนำมังงะดีๆ
    ให้น้องสาวสุดน่ารักของพี่เป็นนิหน้าและไอเรื่องก่อนหน้ามันคืออะไรคะ?
  character: akari
- msg: 'แค่เอามาแกล้งหนูงั้นหรอคะพี่~ '
  character: akari
- msg: แฮะๆ พี่แค่อยากแกล้งน้องสาวสุดน่ารักของพี่เฉยๆ
  character: minato
- msg: พี่นิน้าาา !!!!
  character: akari
- sound: sv_Body Fall
- msg: '*Akari ตีไหล่พี่แรงที่สุดเท่าที่ทำได้*'
  character: akari
- msg: พี่ต้องเจอแบบนี้!!
  character: akari
- msg: อืมม~ นี้นวดไหล่ให้พี่หรอ
  character: minato
- msg: ใช่ที่ไหนละไอพี่บ้า!!
  character: akari
- msg: หลังตีไปสักพัก Akari ก็สงบลงบ้างแล้วกลับไปนั่งที่โซฟา
  character: narrator
- msg: บ้าๆ พี่บ้าที่สุด เฮ้อ
  character: akari
- msg: หายโกรธแล้วหรอ~
  character: minato
- msg: ม่ได้โกรธค่ะ แค่หมั่นเขี้ยวพี่ชายนิดหน่อย
  character: akari
- msg: 'หมั่นเขี้ยวหรอ นึกว่าบริการนวดฟรี '
  character: minato
- msg: นวดอะไรค่ะพี่เอาไปนี้ไป นี่แน่ะ ทุบแรงๆ
  character: akari
- msg: อาา สบายจังเลยย
  character: minato
- msg: เหนื่อยจังสงสัยใช่แรงเยอะไป
  character: akari
- msg: ไม่ทุบหลังพี่ต่อแล้วหรอ แย่จังนึกว่าบริการนวดฟรีจะได้อยู่นานกว่านี้ซะหน่อย~
  character: minato
- msg: พี่อ่า!!...เฮ้ออ~
  character: akari
